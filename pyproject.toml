[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-atticus"
version = "1.0.0"
description = "Local-first Windows assistant: CLI chat, memory, voice, optional tools, Textual desk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
providers = [
  "anthropic>=0.34",
  "google-genai>=1.0",
]
stt = [
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "vosk>=0.3.45",
]
desktop = [
  "textual>=0.78.0",
]
pdf = [
  "pypdf>=4.0",
]
secrets = [
  "keyring>=25.0",
]
gmail = [
  "google-api-python-client>=2.140",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
]

[project.scripts]
atticus = "atticus.app:main"
atticus-desktop = "atticus.desktop:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
