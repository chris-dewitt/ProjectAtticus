name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        run: pip install -e ".[dev,api]"
      - name: Unit and integration tests
        run: pytest -q
      - name: Evaluation smoke suite
        run: python scripts/run_evals.py --suite platform
      - name: Signature demo smoke
        run: python scripts/run_signature_demo.py --artifacts data/artifacts/ci_signature_demo

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t projectatticus-api:ci .
      - name: Build web image
        run: docker build -t projectatticus-web:ci ./web
