# Example configuration — copied automatically if config/atticus.yaml is missing.
# For local overrides: copy this file to config/atticus.yaml (gitignored).

assistant:
  name: Atticus
  user_address: Boss
  default_mode: default
  default_provider: openai
  # Leave repo_path unset so prompts load from the repo root (parent of config/).

providers:
  routing:
    automatic: true
    default_provider: openai
    allow_manual_override: true
    fallback_order: ["openai", "anthropic", "gemini"]
    record_routing_decisions: true
  openai:
    enabled: true
    model: "gpt-4o-mini"
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 60
  anthropic:
    enabled: true
    model: "claude-3-5-sonnet-20241022"
    api_key_env: ANTHROPIC_API_KEY
    timeout_seconds: 60
  gemini:
    enabled: true
    model: "gemini-1.5-flash"
    api_key_env: GEMINI_API_KEY
    timeout_seconds: 60

privacy:
  memory_enabled: true
  store_raw_conversations: false
  store_summaries: true
  ask_before_sending_files_to_cloud: true
  ask_before_open_url: true

memory:
  backend: sqlite
  sqlite_path: "data/atticus_memory.sqlite3"
  allow_forget: true
  auto_summarize: true
  auto_summarize_every_n_turns: 6
  summary_max_chars: 900

# Track B — optional local API (pip install -e ".[api]")
api:
  enabled: false
  host: "127.0.0.1"
  port: 8000
  docs_enabled: false
  # Retro terminal UI at /ui (phone: atticus-api --host 0.0.0.0 on trusted LAN only)
  ui_enabled: true
  runs_sqlite_path: "data/atticus_runs.sqlite3"
  traces_sqlite_path: "data/atticus_traces.sqlite3"
  max_messages_per_run: 32
  include_system_prompt: true
  # When ATTICUS_API_TOKEN is set, /v1 requires X-Atticus-Api-Token
  api_token_env: ATTICUS_API_TOKEN
  rate_limit_per_minute: 180

# Track B M3 — durable policy decisions and token-gated approval decisions.
policy:
  approvals_sqlite_path: "data/atticus_approvals.sqlite3"
  approval_ttl_seconds: 900
  approval_token_env: ATTICUS_APPROVAL_TOKEN

# Track B M4 — sandboxed local execution
sandbox:
  enabled: true
  timeout_seconds: 5.0
  max_output_bytes: 32000
  allow_shell: false
  work_dir: "data/sandbox"

# Telemetry hooks + optional OTel-shaped JSON file exporter
telemetry:
  enabled: true
  service_name: "project-atticus"
  environment: local
  log_level: INFO
  emit_stderr: false
  otel_exporter: none  # none | stderr | file
  otel_file_path: "data/telemetry/otel.jsonl"

voice:
  spoken_responses: false
  muted: false
  tts_engine: pyttsx3
  tts_rate: null
  stt_engine: none
  push_to_talk_default_seconds: 8.0
  vosk_model_path: null
  microphone_device: null
  sample_rate_hz: 16000
  wake_listen_seconds: 12.0
  wake_command_seconds: 10.0
  wake_phrases:
    - Atticus
    - Hey Atticus
    - Atticus please
    - Atticus, old son

tools:
  enabled: false
  # When you enable file tools, list directories Atticus may read (resolved from cwd):
  approved_paths:
    - "."
  github:
    enabled: false
    token_env: GITHUB_TOKEN
    repo_list_limit: 25
    pr_list_limit: 20
  shell:
    enabled: false
    require_confirmation: true
    allow_patch_apply: true
    allow_test_commands: true
    test_timeout_seconds: 120
  files:
    enabled: false
    require_confirmation_for_edits: true
  email:
    enabled: false
    require_confirmation_for_send: true
    # Google Cloud OAuth desktop client secrets JSON (never commit real credentials):
    gmail_client_secrets_path: null
    gmail_token_path: "data/gmail_token.json"
    gmail_inbox_limit: 10
  calendar:
    enabled: false
    require_confirmation_for_write: true
    # Reuses Gmail client secrets when null:
    client_secrets_path: null
    token_path: "data/calendar_token.json"
    calendar_id: "primary"
    list_days: 7
    max_events: 20
  browser:
    enabled: false
    require_confirmation: true
    # Empty allowlist = any non-local http(s) host after approval:
    allowed_hosts: []
    max_response_bytes: 500000
    citation_dir: "data/citations"
